<div class="user-form-page">

  <div class="form-card">

    <div class="form-header">
      <h2>
        @if (isEdit) {
          Edit User
        } @else {
          Add User
        }
      </h2>

      <p>
        Manage system users and role access
      </p>
    </div>

    @if (loading) {
      <div class="loading-box">
        Loading user data...
      </div>
    } @else {

      <div class="form-grid">

        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            [(ngModel)]="formData.fullName"
            placeholder="Example: Ahmad Admin"
          />
        </div>

        <div class="form-group">
          <label>Username</label>
          <input
            type="text"
            [(ngModel)]="formData.username"
            placeholder="Example: ahmad.admin"
          />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            [(ngModel)]="formData.email"
            placeholder="user@gmail.com"
          />
        </div>

        <div class="form-group">
          <label>
            Password
            @if (isEdit) {
              <span class="optional-text">(leave same or edit)</span>
            }
          </label>

          <input
            type="text"
            [(ngModel)]="formData.password"
            placeholder="Enter password"
          />
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input
            type="text"
            [(ngModel)]="formData.phone"
            placeholder="0599000000"
          />
        </div>

        <div class="form-group">
          <label>Role</label>
          <select [(ngModel)]="formData.roleId">
            @for (role of roles; track role.id) {
              <option [ngValue]="role.id">
                {{ role.name }}
              </option>
            }
          </select>
        </div>

      </div>

      <div class="form-actions">
        <button
          class="cancel-btn"
          type="button"
          (click)="cancel()"
        >
          Cancel
        </button>

        <button
          class="save-btn"
          type="button"
          (click)="saveUser()"
          [disabled]="saving"
        >
          @if (saving) {
            Saving...
          } @else if (isEdit) {
            Update User
          } @else {
            Save User
          }
        </button>
      </div>

    }

  </div>

</div>
